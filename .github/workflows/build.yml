name: Build frontend and backend

on: 
  push:
    branches:
      - main
      - develop
      - production
    
  pull_request:
    branches:
      - main
      - develop
      - production 
      - 'feature/**'
      - 'bug/**'
      - 'improvement/**'
      - 'dependabot/**'

jobs:
  frontend-build:
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd ./frontend 
          npm ci 

      - name: Build frontend
        env:
          AWS_CDN_URL: ${{ secrets.AWS_CDN_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} 
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          cd ./frontend 
          npm run build
        
  backend-build:
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'

      - name: Install backend dependencies
        run: |
          cd ./backend 
          npm ci

      - name: Check single ckeditor5 version
        run: |
          cd ./backend
          node -e "const p=require('./package-lock.json').packages;const v=Object.keys(p).filter(k=>k.endsWith('node_modules/ckeditor5')).map(k=>p[k].version);if(v.length!==1){console.error('Expected one ckeditor5, found: '+v.join(', '));process.exit(1)}console.log('ckeditor5 '+v[0])"

      - name: Build backend
        run: |
          cd ./backend 
          npm run build

      

     
      
      
