version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "improvement"
    open-pull-requests-limit: 10
    groups:
      blocknote:
        patterns:
          - "@blocknote/*"
      tiptap:
        patterns:
          - "@tiptap/*"
          - "@aarkue/tiptap-math-extension"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
    commit-message:
      prefix: "improvement"
    open-pull-requests-limit: 10
    groups:
      ckeditor:
        patterns:
          - "ckeditor5"
          - "@ckeditor/*"
          - "@_sh/strapi-plugin-ckeditor"
      strapi:
        patterns:
          - "@strapi/*"
